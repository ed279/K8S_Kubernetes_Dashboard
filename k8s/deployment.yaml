apiVersion: v1
kind: Namespace
metadata:
  name: dashboard

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-config
  namespace: dashboard
data:
  TZ: "America/Los_Angeles"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-dashboard
  namespace: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-dashboard
  template:
    metadata:
      labels:
        app: k8s-dashboard
    spec:
      serviceAccountName: dashboard-sa
      containers:
      - name: k8s-dashboard
        image: localhost:5000/k8s-dashboard:v45
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: TZ
          value: "America/Los_Angeles"
        volumeMounts:
        - name: ssh-key
          mountPath: /home/dashboard/.ssh
          readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: ssh-key
        secret:
          secretName: dashboard-ssh-key
          defaultMode: 0600

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-sa
  namespace: dashboard

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dashboard-reader
rules:
- apiGroups: [""]
  resources: ["pods", "nodes", "services"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods", "nodes"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dashboard-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dashboard-reader
subjects:
- kind: ServiceAccount
  name: dashboard-sa
  namespace: dashboard

---
apiVersion: v1
kind: Service
metadata:
  name: k8s-dashboard
  namespace: dashboard
spec:
  type: NodePort
  selector:
    app: k8s-dashboard
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30085
    name: http
